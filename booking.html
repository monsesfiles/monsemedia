<!-- EMAIL NOTIFICATION PREFERENCES -->

<section class="booking-notifications">

    <h3>STAY CONNECTED.</h3>

    <p>
        Receive optional email reminders before
        your confirmed creative sessions.
    </p>

    <label class="checkbox-label">

        <input type="checkbox"
               id="updateEmailPreferences">

        Update my account-wide email reminder preferences.

    </label>

    <fieldset id="bookingEmailChoices" disabled>

        <legend>Appointment email reminders</legend>

        <label class="checkbox-label">

            <input type="checkbox"
                   name="week_before"
                   value="yes">

            Email me one week before my session.

        </label>

        <label class="checkbox-label">

            <input type="checkbox"
                   name="day_before"
                   value="yes">

            Email me one day before my session.

        </label>

        <label class="checkbox-label">

            <input type="checkbox"
                   name="morning_of"
                   value="yes">

            Email me the morning of my session,
            when applicable.

        </label>

    </fieldset>

    <p class="muted small">

        Reminders will be sent to your verified
        account email address. You can change these
        preferences in your account settings at any time.

    </p>

</section>
